[project]
name = "zapfiles"
version = "2.1.0"
description = "A secure file transfer tool that ensures the privacy of your data through end-to-end encryption."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Meynrun" }]
dependencies = [
    "colorama>=0.4.6",
    "cryptography>=46.0.2",
    "prettytable>=3.16.0",
    "questionary>=2.1.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "nuitka>=2.7.16",
    "pre-commit>=4.3.0",
    "pyright[nodejs]>=1.1.406",
    "ruff>=0.13.3",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[project.scripts]
zapfiles = "zapfiles.__main__:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zapfiles*"]
exclude = ["assets", "config", "dist", "generated_zapfiles", "Output", "server_files"]
